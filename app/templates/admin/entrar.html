<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · {{ loja.nome_loja }}</title>
  <link rel="icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,700;1,700;1,800;1,900&family=Albert+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/site.css?v=1">
  <link rel="stylesheet" href="/static/css/admin.css?v=1">
</head>
<body>
  <main class="entrar-pagina">
    <form class="entrar-cartao bloco" method="post" action="/admin/entrar">
      <img class="entrar-logo" src="/static/img/logo.png" alt="{{ loja.nome_loja }}">
      <h1>Painel da loja</h1>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
      <label class="campo"><span>E-mail</span><input class="entrada" type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="campo"><span>Senha</span><input class="entrada" type="password" name="senha" autocomplete="current-password" required></label>
      <button class="btn red" type="submit">Entrar</button>
      <a class="voltar-site" href="/">Voltar para o site</a>
    </form>
  </main>
</body>
</html>
